<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentinel — Géoveille internationale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#0a0d12;
  --bg-panel:#12161d;
  --bg-panel-2:#171c26;
  --bg-hover:#1c222d;
  --border:#262c38;
  --ink:#e6e9ef;
  --ink-dim:#8f99a8;
  --ink-faint:#5b6472;
  --accent:#c9a227;
  --accent-soft:#c9a22722;
  --red:#c0392b;
  --red-soft:#c0392b22;
  --orange:#dc7f2e;
  --orange-soft:#dc7f2e22;
  --green:#3f9c6d;
  --green-soft:#3f9c6d22;
  --radius:3px;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'IBM Plex Sans',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg-deep);color:var(--ink);font-family:var(--font-body);}
::selection{background:var(--accent-soft);}
a{color:var(--accent);text-decoration:none;}
a:hover{text-decoration:underline;}
button{font-family:var(--font-body);cursor:pointer;}

/* ---------- header ---------- */
header{
  border-bottom:1px solid var(--border);
  background:var(--bg-panel);
  padding:14px 22px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:20;
}
.brand{display:flex;align-items:baseline;gap:10px;}
.brand .mark{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);}
.brand .mark.off{background:var(--red);box-shadow:0 0 8px var(--red);}
.brand h1{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:.04em;margin:0;}
.brand .sub{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);letter-spacing:.08em;text-transform:uppercase;}
.header-right{display:flex;align-items:center;gap:14px;font-family:var(--font-mono);font-size:12px;color:var(--ink-dim);}
.header-right .clock{color:var(--accent);}
.btn{
  background:var(--bg-panel-2);border:1px solid var(--border);color:var(--ink);
  padding:7px 12px;border-radius:var(--radius);font-size:12px;font-family:var(--font-mono);
  letter-spacing:.03em;transition:all .15s;
}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn:disabled{opacity:.4;cursor:default;}

/* ---------- zone tabs ---------- */
.zonebar{
  display:flex;gap:2px;overflow-x:auto;background:var(--bg-panel);
  border-bottom:1px solid var(--border);padding:0 22px;
}
.zonebar::-webkit-scrollbar{height:0;}
.zone-tab{
  padding:11px 16px;font-family:var(--font-mono);font-size:12.5px;color:var(--ink-dim);
  border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:8px;
}
.zone-tab:hover{color:var(--ink);cursor:pointer;}
.zone-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.zone-tab .gauge{width:26px;height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.zone-tab .gauge i{display:block;height:100%;background:var(--ink-faint);}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:1fr 360px;gap:0;max-width:1440px;margin:0 auto;}
@media (max-width:980px){.layout{grid-template-columns:1fr;}}
main{padding:22px;min-width:0;}
aside{border-left:1px solid var(--border);padding:22px;min-width:0;}

.themebar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px;}
.chip{
  font-family:var(--font-mono);font-size:11px;padding:5px 10px;border-radius:12px;
  border:1px solid var(--border);color:var(--ink-dim);letter-spacing:.02em;
}
.chip:hover{cursor:pointer;border-color:var(--ink-faint);}
.chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

/* ---------- briefing panel ---------- */
.panel{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:20px;}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;border-bottom:1px solid var(--border);
}
.panel-head h2{font-family:var(--font-display);font-size:14px;margin:0;letter-spacing:.03em;text-transform:uppercase;color:var(--ink);}
.panel-head .meta{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);}
.panel-body{padding:16px;}
.briefing-body h2{font-family:var(--font-display);font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);margin:16px 0 8px;}
.briefing-body h2:first-child{margin-top:0;}
.briefing-body ul{margin:0 0 8px;padding-left:18px;}
.briefing-body li{margin-bottom:5px;line-height:1.5;font-size:13.5px;color:var(--ink);}
.briefing-body p{line-height:1.6;font-size:13.5px;color:var(--ink);margin:0 0 8px;}
.briefing-body strong{color:var(--accent);}
.empty{color:var(--ink-faint);font-size:13px;font-style:italic;padding:6px 0;}

/* ---------- tension badge ---------- */
.tension{font-family:var(--font-mono);font-size:10.5px;padding:2px 7px;border-radius:2px;letter-spacing:.03em;}
.tension.t-low{background:var(--green-soft);color:var(--green);}
.tension.t-mid{background:var(--accent-soft);color:var(--accent);}
.tension.t-high{background:var(--orange-soft);color:var(--orange);}
.tension.t-crit{background:var(--red-soft);color:var(--red);}

/* ---------- article list ---------- */
.article{
  padding:13px 0;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:5px;
}
.article:last-child{border-bottom:none;}
.article-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);}
.article-top .theme-tag{color:var(--ink-dim);border:1px solid var(--border);padding:1px 7px;border-radius:10px;}
.article-title{font-size:14px;line-height:1.4;color:var(--ink);font-weight:500;}
.article-title a{color:var(--ink);}
.article-title a:hover{color:var(--accent);}
.article-summary{font-size:12.5px;color:var(--ink-dim);line-height:1.5;}
.article-bottom{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);}

/* ---------- alerts ---------- */
.alert{
  padding:10px 12px;border-left:2px solid var(--red);background:var(--red-soft);
  border-radius:0 var(--radius) var(--radius) 0;margin-bottom:8px;
}
.alert .a-reason{font-family:var(--font-mono);font-size:10.5px;color:var(--red);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;}
.alert .a-title{font-size:12.5px;color:var(--ink);line-height:1.4;}
.alert .a-meta{font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);margin-top:4px;}

/* ---------- ask box ---------- */
.ask-box textarea{
  width:100%;background:var(--bg-deep);border:1px solid var(--border);color:var(--ink);
  border-radius:var(--radius);padding:10px;font-family:var(--font-body);font-size:13px;
  resize:vertical;min-height:64px;
}
.ask-box textarea:focus{outline:none;border-color:var(--accent);}
.ask-answer{margin-top:12px;font-size:13px;line-height:1.6;color:var(--ink);white-space:pre-wrap;}
.ask-sources{margin-top:10px;display:flex;flex-direction:column;gap:5px;}
.ask-sources a{font-size:11.5px;font-family:var(--font-mono);color:var(--ink-dim);}
.ask-sources a:hover{color:var(--accent);}

.loading{color:var(--ink-faint);font-family:var(--font-mono);font-size:12px;padding:14px 0;}
.stat-line{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);padding:4px 0;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="mark off" id="statusDot"></span>
    <h1>SENTINEL</h1>
    <span class="sub">Géoveille internationale — LLM local</span>
  </div>
  <div class="header-right">
    <span id="pendingCount">— en file</span>
    <span class="clock" id="clock">--:--:--</span>
    <button class="btn" id="btnCollect">Lancer la collecte</button>
    <button class="btn" id="btnBriefAll">Générer les bilans</button>
  </div>
</header>

<div class="zonebar" id="zonebar"></div>

<div class="layout">
  <main>
    <div class="themebar" id="themebar"></div>

    <div class="panel">
      <div class="panel-head">
        <h2 id="briefingTitle">Bilan</h2>
        <span class="meta" id="briefingMeta"></span>
      </div>
      <div class="panel-body briefing-body" id="briefingBody"><div class="loading">Chargement…</div></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Fil d'actualité</h2>
        <span class="meta" id="articlesMeta"></span>
      </div>
      <div class="panel-body" id="articlesBody"><div class="loading">Chargement…</div></div>
    </div>
  </main>

  <aside>
    <div class="panel">
      <div class="panel-head"><h2>Interroger la veille</h2></div>
      <div class="panel-body ask-box">
        <textarea id="askInput" placeholder="Ex : Quelles sont les dernières tensions en mer de Chine méridionale ?"></textarea>
        <button class="btn" id="btnAsk" style="margin-top:8px;width:100%;">Poser la question</button>
        <div id="askAnswer"></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Alertes récentes</h2>
        <span class="meta" id="alertsMeta"></span>
      </div>
      <div class="panel-body" id="alertsBody"><div class="loading">Chargement…</div></div>
    </div>
  </aside>
</div>

<script>
const API = "";
let currentZone = "Monde";
let currentTheme = null;
let ZONES = [];
let THEMES = [];
let zoneStats = {};

function fmtAgo(iso){
  if(!iso) return "";
  const d = new Date(iso.endsWith('Z') ? iso : iso + 'Z');
  const diffMin = Math.round((Date.now() - d.getTime())/60000);
  if(diffMin < 1) return "à l'instant";
  if(diffMin < 60) return `il y a ${diffMin} min`;
  const h = Math.round(diffMin/60);
  if(h < 24) return `il y a ${h} h`;
  return `il y a ${Math.round(h/24)} j`;
}

function tensionClass(score){
  if(score >= 80) return "t-crit";
  if(score >= 55) return "t-high";
  if(score >= 30) return "t-mid";
  return "t-low";
}

function escapeHtml(s){
  if(!s) return "";
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// Rendu markdown minimal pour les bilans générés par le LLM (titres ##, listes -, gras **)
function renderMarkdown(md){
  const lines = escapeHtml(md).split("\n");
  let html = "", inList = false;
  for(let line of lines){
    line = line.trim();
    if(!line){ if(inList){html+="</ul>";inList=false;} continue; }
    if(line.startsWith("## ")){
      if(inList){html+="</ul>";inList=false;}
      html += `<h2>${line.slice(3)}</h2>`;
    } else if(line.startsWith("- ") || line.startsWith("* ")){
      if(!inList){html+="<ul>";inList=true;}
      html += `<li>${line.slice(2)}</li>`;
    } else {
      if(inList){html+="</ul>";inList=false;}
      html += `<p>${line}</p>`;
    }
  }
  if(inList) html += "</ul>";
  html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  return html || '<p class="empty">Bilan vide.</p>';
}

async function api(path, opts){
  const res = await fetch(API + path, opts);
  if(!res.ok) throw new Error(await res.text());
  return res.json();
}

function buildZoneBar(){
  const bar = document.getElementById("zonebar");
  bar.innerHTML = "";
  ZONES.forEach(z => {
    const stat = zoneStats[z] || {avg_tension: 0, n: 0};
    const el = document.createElement("div");
    el.className = "zone-tab" + (z === currentZone ? " active" : "");
    el.innerHTML = `<span>${z}</span><span class="gauge"><i style="width:${Math.min(100, stat.avg_tension||0)}%;background:${tensionColor(stat.avg_tension||0)}"></i></span>`;
    el.onclick = () => { currentZone = z; refreshZoneDependent(); buildZoneBar(); };
    bar.appendChild(el);
  });
}

function tensionColor(score){
  if(score >= 80) return "var(--red)";
  if(score >= 55) return "var(--orange)";
  if(score >= 30) return "var(--accent)";
  return "var(--green)";
}

function buildThemeBar(){
  const bar = document.getElementById("themebar");
  bar.innerHTML = "";
  const allChip = document.createElement("div");
  allChip.className = "chip" + (currentTheme === null ? " active" : "");
  allChip.textContent = "Toutes thématiques";
  allChip.onclick = () => { currentTheme = null; refreshArticles(); buildThemeBar(); };
  bar.appendChild(allChip);
  THEMES.forEach(t => {
    const chip = document.createElement("div");
    chip.className = "chip" + (currentTheme === t ? " active" : "");
    chip.textContent = t;
    chip.onclick = () => { currentTheme = t; refreshArticles(); buildThemeBar(); };
    bar.appendChild(chip);
  });
}

async function refreshStats(){
  try{
    const stats = await api("/api/stats");
    zoneStats = {};
    stats.by_zone.forEach(z => zoneStats[z.zone] = z);
    document.getElementById("pendingCount").textContent = `${stats.pending_classification} en file`;
    buildZoneBar();
  }catch(e){ console.error(e); }
}

async function refreshHealth(){
  try{
    const h = await api("/api/health");
    document.getElementById("statusDot").className = "mark" + (h.ollama_connected ? "" : " off");
  }catch(e){
    document.getElementById("statusDot").className = "mark off";
  }
}

async function refreshBriefing(){
  const body = document.getElementById("briefingBody");
  const title = document.getElementById("briefingTitle");
  const meta = document.getElementById("briefingMeta");
  title.textContent = `Bilan — ${currentZone}`;
  body.innerHTML = '<div class="loading">Chargement…</div>';
  try{
    const all = await api("/api/briefings/latest");
    const b = all.find(x => x.zone === currentZone);
    if(!b){
      body.innerHTML = '<p class="empty">Aucun bilan généré pour cette zone pour le moment. Utilise "Générer les bilans" ou attends le prochain bilan automatique (matin/soir).</p>';
      meta.textContent = "";
      return;
    }
    body.innerHTML = renderMarkdown(b.content_md);
    meta.textContent = `${fmtAgo(b.created_at)} · ${b.article_count} article(s) · ${b.period}`;
  }catch(e){
    body.innerHTML = `<p class="empty">Erreur de chargement du bilan.</p>`;
  }
}

async function refreshArticles(){
  const body = document.getElementById("articlesBody");
  const meta = document.getElementById("articlesMeta");
  body.innerHTML = '<div class="loading">Chargement…</div>';
  try{
    let path = `/api/articles?hours=72&limit=60`;
    if(currentZone && currentZone !== "Monde") path += `&zone=${encodeURIComponent(currentZone)}`;
    if(currentTheme) path += `&theme=${encodeURIComponent(currentTheme)}`;
    const articles = await api(path);
    meta.textContent = `${articles.length} article(s) · 72h`;
    if(articles.length === 0){
      body.innerHTML = '<p class="empty">Aucun article pour ce filtre. Lance une collecte ou élargis les critères.</p>';
      return;
    }
    body.innerHTML = "";
    articles.forEach(a => {
      const div = document.createElement("div");
      div.className = "article";
      div.innerHTML = `
        <div class="article-top">
          <span class="theme-tag">${a.theme || "?"}</span>
          <span>${a.zone || "?"}</span>
          <span class="tension ${tensionClass(a.tension_score||0)}">Tension ${a.tension_score ?? "?"}</span>
        </div>
        <div class="article-title"><a href="${a.url}" target="_blank" rel="noopener">${escapeHtml(a.title)}</a></div>
        <div class="article-summary">${escapeHtml(a.summary_fr || "")}</div>
        <div class="article-bottom">${a.source} · ${fmtAgo(a.fetched_at)}</div>
      `;
      body.appendChild(div);
    });
  }catch(e){
    body.innerHTML = '<p class="empty">Erreur de chargement des articles.</p>';
  }
}

async function refreshAlerts(){
  const body = document.getElementById("alertsBody");
  const meta = document.getElementById("alertsMeta");
  try{
    const alerts = await api("/api/alerts?limit=20");
    meta.textContent = `${alerts.length}`;
    if(alerts.length === 0){
      body.innerHTML = '<p class="empty">Aucune alerte récente.</p>';
      return;
    }
    body.innerHTML = "";
    alerts.forEach(a => {
      const div = document.createElement("div");
      div.className = "alert";
      div.innerHTML = `
        <div class="a-reason">${escapeHtml(a.reason)}</div>
        <div class="a-title"><a href="${a.url || '#'}" target="_blank" rel="noopener">${escapeHtml(a.title || "")}</a></div>
        <div class="a-meta">${a.zone || ""} · ${a.theme || ""} · ${fmtAgo(a.created_at)}</div>
      `;
      body.appendChild(div);
    });
  }catch(e){
    body.innerHTML = '<p class="empty">Erreur de chargement des alertes.</p>';
  }
}

function refreshZoneDependent(){
  refreshBriefing();
  refreshArticles();
}

document.getElementById("btnCollect").onclick = async (e) => {
  e.target.disabled = true; e.target.textContent = "Collecte en cours…";
  try{ await api("/api/collect", {method:"POST"}); }catch(err){}
  setTimeout(() => { e.target.disabled = false; e.target.textContent = "Lancer la collecte"; refreshStats(); refreshArticles(); }, 4000);
};

document.getElementById("btnBriefAll").onclick = async (e) => {
  e.target.disabled = true; e.target.textContent = "Génération en cours…";
  try{ await api("/api/briefings/generate-all", {method:"POST"}); }catch(err){}
  setTimeout(() => { e.target.disabled = false; e.target.textContent = "Générer les bilans"; refreshBriefing(); }, 6000);
};

document.getElementById("btnAsk").onclick = async () => {
  const input = document.getElementById("askInput");
  const answerBox = document.getElementById("askAnswer");
  const q = input.value.trim();
  if(q.length < 3) return;
  answerBox.innerHTML = '<div class="loading">Analyse en cours…</div>';
  try{
    const res = await api("/api/ask", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({question: q, zone: currentZone === "Monde" ? null : currentZone})
    });
    let html = `<div class="ask-answer">${escapeHtml(res.answer)}</div>`;
    if(res.sources && res.sources.length){
      html += '<div class="ask-sources">' + res.sources.map(s =>
        `<a href="${s.url}" target="_blank" rel="noopener">→ ${escapeHtml(s.title)} (${escapeHtml(s.source)})</a>`
      ).join("") + '</div>';
    }
    answerBox.innerHTML = html;
  }catch(e){
    answerBox.innerHTML = '<div class="ask-answer">Erreur lors de la requête.</div>';
  }
};

function tickClock(){
  document.getElementById("clock").textContent = new Date().toLocaleTimeString('fr-FR');
}

async function init(){
  ZONES = await api("/api/zones");
  THEMES = await api("/api/themes");
  buildZoneBar();
  buildThemeBar();
  refreshHealth();
  refreshStats();
  refreshBriefing();
  refreshArticles();
  refreshAlerts();

  setInterval(tickClock, 1000);
  setInterval(refreshHealth, 30000);
  setInterval(refreshStats, 30000);
  setInterval(refreshAlerts, 30000);
  tickClock();
}

init();
</script>
</body>
</html>
